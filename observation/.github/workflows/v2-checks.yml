name: V2 checks

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run lint
      - name: Run all module checks
        run: npm run lint:all
      - name: Verify dashboard browser interactions
        if: runner.os == 'Linux'
        run: node scripts/check-ui-navigation.mjs
      - name: Check module boundaries
        run: npm run check:structure
      - name: Audit dependencies
        run: npm audit --omit=dev
