name: unified-checkin

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Gitleaks
        shell: pwsh
        run: |
          $version = '8.30.1'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks_$version.zip"
          $directory = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw "Gitleaks archive hash mismatch: $actualHash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Scan history
        shell: pwsh
        run: gitleaks git --config execution/.gitleaks.toml --redact --no-banner --exit-code 1 .
      - run: npm ci --prefix execution
      - run: npm ci --prefix observation
      - run: npm test
      - name: Harvest evidence and concurrent-task tests
        run: python -m unittest discover -s observation/tests -p '*_test.py'
      - run: npm run lint
      - name: Scan public files
        shell: pwsh
        run: ./execution/scripts/Scan-PublicSafety.ps1 -Root .
      - name: Audit execution dependencies
        run: ./scripts/Invoke-NpmAuditWithRetry.ps1
        working-directory: execution
      - name: Audit observation dependencies
        run: ../execution/scripts/Invoke-NpmAuditWithRetry.ps1
        working-directory: observation

  dashboard-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci --prefix observation
      - run: node scripts/check-ui-navigation.mjs
        working-directory: observation
