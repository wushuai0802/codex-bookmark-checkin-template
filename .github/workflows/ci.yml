name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: pwsh
        run: |
          $version = '8.30.1'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks_$version.zip"
          $directory = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') {
            throw "Gitleaks archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Scan Git history for secrets
        shell: pwsh
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scan tracked files for private data
        shell: pwsh
        run: ./scripts/Scan-PublicSafety.ps1
      - name: Audit production dependencies with bounded retry
        shell: pwsh
        run: ./scripts/Invoke-NpmAuditWithRetry.ps1
